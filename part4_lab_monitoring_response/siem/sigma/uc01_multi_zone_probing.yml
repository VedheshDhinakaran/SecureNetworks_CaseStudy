title: SJV firewall deny (base rule for correlations)
id: 5b0f3c6e-3f0d-43f1-b8fa-c92ad472f7a7
name: sjv_fw_deny
status: experimental
description: |
  Every packet the Sanjivani NGFW denied. Not an alert by itself; it is the
  input to UC-01. Field rule_id is the CS07 rule ID taken from the pf label
  map at ingestion; dst_zone is added by the SIEM from the zone table in
  part2_architecture_protocols/network/objects.yaml.
author: CS07 Team (Part IV)
date: 2026-10-27
logsource:
  product: opnsense
  service: filterlog
detection:
  selection:
    action:
      - block
      - reject
  condition: selection
fields: [src_ip, dst_ip, dst_port, rule_id, dst_zone]
level: informational
---
title: UC-01 Multi-zone probing (lateral movement)
id: dfa30d68-105f-418c-bb16-d4071ac77eed
status: experimental
description: One source denied in three or more distinct zones within 60 seconds.
author: CS07 Team (Part IV)
date: 2026-10-27
references:
  - CS07 report, Section 12.2 (UC-01), threat T-LAT
correlation:
  type: value_count
  rules:
    - sjv_fw_deny
  group-by:
    - src_ip
  timespan: 60s
  condition:
    field: dst_zone
    gte: 3
falsepositives:
  - Authorised assessment host running the quarterly nmap sweep (whitelist by change ticket)
level: high
tags:
  - attack.lateral-movement
  - attack.discovery
  - attack.t1046
