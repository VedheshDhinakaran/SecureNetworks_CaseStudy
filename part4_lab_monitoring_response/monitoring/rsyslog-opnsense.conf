# =====================================================================
#  rsyslog on the bastion / log collector (192.168.90.5)
#  Receives OPNsense remote logs (System > Settings > Logging > Remote).
#
#  Lab:        UDP 514, plain text (report Section 11.4 step 5)
#  Production: TCP 6514 with TLS (protocol register; rule M-04)
#
#  Install:  sudo cp rsyslog-opnsense.conf /etc/rsyslog.d/30-opnsense.conf
#            sudo systemctl restart rsyslog
#  Output:   /var/log/opnsense.log  (filterlog + suricata + audit)
#            /var/log/opnsense/<program>.log
# =====================================================================

module(load="imudp")
input(type="imudp" port="514" address="192.168.90.5" ruleset="opnsense")

# ---- Production: syslog over TLS (uncomment, set the certificate paths) ----
# global(DefaultNetstreamDriver="gtls"
#        DefaultNetstreamDriverCAFile="/etc/rsyslog.d/tls/ca.pem"
#        DefaultNetstreamDriverCertFile="/etc/rsyslog.d/tls/collector.pem"
#        DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/tls/collector.key")
# module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1"
#        StreamDriver.AuthMode="x509/name" PermittedPeer=["fw-a.sjv.local","fw-b.sjv.local"])
# input(type="imtcp" port="6514" ruleset="opnsense")

# Keep the RFC 5424 timestamp with offset, so timelines line up with
# the attempt marks (CERT-In: clocks synchronised to NIC/NPL NTP).
template(name="opnsense_raw" type="string"
         string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% %HOSTNAME% %APP-NAME% %PROCID% %MSGID% %STRUCTURED-DATA% %msg%\n")
template(name="opnsense_by_prog" type="string" string="/var/log/opnsense/%programname%.log")

ruleset(name="opnsense") {
  action(type="omfile" file="/var/log/opnsense.log" template="opnsense_raw")
  action(type="omfile" dynaFile="opnsense_by_prog" template="opnsense_raw")
  stop
}

# Retention: CERT-In directions require 180 days of ICT logs kept in India.
# See logrotate-opnsense in this folder.
